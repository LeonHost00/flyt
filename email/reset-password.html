<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0d1b2a; color: #e0e6ed; margin: 0; padding: 0; -webkit-font-smoothing: antialiased;">
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #0d1b2a;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 500px; background-color: #1b263b; border-radius: 24px; border: 1px solid rgba(58, 122, 104, 0.25); overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);">
          <!-- Header with Logo -->
          <tr>
            <td align="center" style="padding: 40px 40px 20px 40px;">
              <div style="display: block; margin-bottom: 8px;">
                <img src="https://cddircpnawvpryttmpel.supabase.co/storage/v1/object/public/Branding/logo%20520x520.png" alt="Flyt Logo" width="64" height="64" style="display: block; margin: 0 auto;">
              </div>
              <img src="https://cddircpnawvpryttmpel.supabase.co/storage/v1/object/public/Branding/name%20620x300.png" alt="Flyt" height="24" style="display: block; margin: 0 auto;">
            </td>
          </tr>
          
          <!-- Content -->
          <tr>
            <td style="padding: 20px 40px 40px 40px; text-align: center;">
              <h1 style="color: #e0e6ed; font-size: 24px; font-weight: 700; margin: 0 0 16px 0; letter-spacing: -0.02em;">Reset Password</h1>
              <p style="color: rgba(224, 230, 237, 0.75); font-size: 16px; line-height: 1.6; margin: 0 0 32px 0;">
                Forgot your password? No problem. It happens to the best of us. Click the button below to set a new one and get back to your flow.
              </p>
              
              <!-- Button -->
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto;">
                <tr>
                  <td align="center" bgcolor="#FF8C42" style="border-radius: 12px;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display: inline-block; padding: 14px 32px; font-family: inherit; font-size: 16px; font-weight: 600; color: #0d1b2a; text-decoration: none; border-radius: 12px; background-color: #FF8C42;">Reset Password</a>
                  </td>
                </tr>
              </table>
              
              <p style="color: rgba(224, 230, 237, 0.4); font-size: 13px; line-height: 1.5; margin: 32px 0 0 0;">
                If you didn't request a password reset, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
        
        <!-- Footer -->
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 500px;">
          <tr>
            <td style="padding: 32px 20px; text-align: center;">
              <p style="color: rgba(224, 230, 237, 0.4); font-size: 12px; margin: 0;">
                &copy; 2026 Flyt. Built for flow.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
