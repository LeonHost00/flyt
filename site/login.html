<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://flytapp.se;">
    <title>Logga in - Flyt</title>
    <link rel="icon" type="image/svg+xml"
        href="https://cddircpnawvpryttmpel.supabase.co/storage/v1/object/public/Branding/logo.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <!-- Shared Theme & Header Styles -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="header.css">

    <style>
        /* ═══════════════════════════════════════════════════════════════════════════
         * LOGIN PAGE - Page-Specific Styles
         * Base theme variables and styles are in theme.css
         * ═══════════════════════════════════════════════════════════════════════════ */

        /* Additional login-specific CSS variables */
        :root {
            /* Core Palette - Nordic Night Sky (Synced with App) */
            --bg-deep: #050a14;
            --bg-primary: #0d1b2a;
            --bg-secondary: #1b263b;
            --surface-primary: rgba(45, 58, 82, 0.4);
            --surface-secondary: rgba(45, 58, 82, 0.6);
            --surface-elevated: rgba(58, 122, 104, 0.15);

            /* Accents: Forest & Cloudberry */
            --color-forest: #3A7A68;
            --color-forest-light: #4CAF76;
            --color-accent: #FF8C42;
            --color-accent-light: #FFA366;
            --color-accent-dark: #E67A30;
            --gradient-cta: linear-gradient(135deg, #FF8C42 0%, #FFA366 100%);
            --gradient-primary: linear-gradient(135deg, #2C5E50 0%, #3A7A68 100%);

            /* Text */
            --text-primary: #e0e6ed;
            --text-secondary: rgba(224, 230, 237, 0.75);
            --text-muted: rgba(224, 230, 237, 0.4);

            /* UI Elements */
            --border-subtle: rgba(58, 122, 104, 0.15);
            --border-default: rgba(58, 122, 104, 0.25);
            --radius-xl: 10px;
            --radius-3xl: 16px;
            --radius-4xl: 20px;
            --shadow-cta: 0 8px 16px rgba(255, 140, 66, 0.35);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.4);

            /* Typography */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-deep);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(58, 122, 104, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(78, 137, 174, 0.1) 0%, transparent 40%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--surface-primary);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-4xl);
            padding: 40px;
            box-shadow: var(--shadow-soft);
            position: relative;
            z-index: 1;
            margin-top: 100px;
            margin-bottom: 60px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
            text-decoration: none;
            display: block;
        }

        .logo img {
            width: 180px;
            margin-bottom: 10px;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .tabs {
            display: flex;
            margin-bottom: 24px;
            background: var(--bg-primary);
            border-radius: 100px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 100px;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--gradient-primary);
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface-secondary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-accent);
            background: rgba(45, 58, 82, 0.8);
            box-shadow: 0 0 0 2px rgba(255, 140, 66, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--gradient-cta);
            color: var(--bg-primary);
            border: none;
            border-radius: var(--radius-xl);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-cta);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-default);
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: var(--surface-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .google-btn:hover {
            background: rgba(45, 58, 82, 0.8);
            border-color: var(--text-secondary);
            transform: translateY(-1px);
        }

        .google-btn svg {
            width: 20px;
            height: 20px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 24px;
            display: none;
        }

        .message.error {
            display: block;
            background: rgba(230, 50, 50, 0.15);
            border: 1px solid rgba(230, 50, 50, 0.3);
            color: #ff8080;
        }

        .message.success {
            display: block;
            background: rgba(76, 175, 118, 0.15);
            border: 1px solid rgba(76, 175, 118, 0.3);
            color: var(--color-forest-light);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 32px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-secondary);
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .submit-btn.loading .text {
            display: none;
        }

        .submit-btn.loading .spinner {
            display: inline-block;
        }
    </style>
</head>

<body>
    <!-- Shared Header -->
    <div id="flyt-header"></div>
    <script src="header.js"></script>

    <div class="auth-container">
        <a href="index.html" class="logo">
            <img src="https://cddircpnawvpryttmpel.supabase.co/storage/v1/object/public/Branding/name.svg" alt="Flyt">
            <p>Välkommen! Logga in för att fortsätta.</p>
        </a>

        <div class="tabs">
            <div class="tab active" data-tab="login">Logga in</div>
            <div class="tab" data-tab="signup">Registrera</div>
        </div>

        <div id="message" class="message"></div>

        <!-- Login Form -->
        <div id="login-container" class="form-container active">
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">E-post</label>
                    <input type="email" id="login-email" placeholder="namn@exempel.se" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Lösenord</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn" id="login-btn">
                    <span class="text">Logga in</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signup-container" class="form-container">
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-email">E-post</label>
                    <input type="email" id="signup-email" placeholder="namn@exempel.se" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Lösenord</label>
                    <input type="password" id="signup-password" placeholder="Minst 6 tecken" minlength="6" required>
                </div>
                <button type="submit" class="submit-btn" id="signup-btn">
                    <span class="text">Skapa konto</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <div class="divider"><span>eller</span></div>

        <button class="google-btn" id="google-btn">
            <svg viewBox="0 0 24 24">
                <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4" />
                <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853" />
                <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    fill="#FBBC05" />
                <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335" />
            </svg>
            Fortsätt med Google
        </button>

        <a href="index.html" class="back-link">Tillbaka till startsidan</a>
    </div>

    <script src="login.js"></script>
</body>

</html>
