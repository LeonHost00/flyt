<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyt - Kontrollpanel</title>
    <link rel="stylesheet" href="theme.css">
    
    <!-- Local libraries for math and Markdown rendering (Performance & Offline support) -->
    <link rel="stylesheet" href="assets/lib/katex.min.css">
    <script src="assets/lib/katex.min.js"></script>
    <script src="assets/lib/marked.umd.js"></script>
    <script src="assets/lib/marked-katex.js"></script>

</head>

<body>
    <!-- Custom Title Bar (Frameless Window) -->
    <div class="title-bar">
        <div class="title-bar-left">
            <div class="title-bar-logo">
                <img src="assets/logo.svg" alt="Flyt Logo" style="width: 20px; height: 20px; margin-right: 8px;">
                Flyt
            </div>
            <span class="title-bar-hint">Ctrl+Shift+C</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-bar-btn pin-btn" id="pin-btn" title="Fäst överst">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                </svg>
            </button>
            <button class="title-bar-btn minimize-btn" id="minimize-btn" title="Minimera till aktivitetsfältet">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
                </svg>
            </button>
            <button class="title-bar-btn close-btn" id="close-btn" title="Stäng (finns kvar i aktivitetsfältet)">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Laddar din kontrollpanel...</p>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- AI Chat Section -->
        <section class="chat-section">
            <div class="chat-background">
                <img src="assets/logo.svg" class="bg-logo" alt="">
            </div>
            <!-- Drop Overlay for Drag and Drop -->
            <div class="drop-overlay" id="drop-overlay">
                <div class="drop-overlay-content">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p>Släpp filer här för att bifoga</p>
                </div>
            </div>
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="mode-toggle" id="mode-toggle">
                        <button class="mode-btn" data-mode="jobba" id="jobba-btn">Jobba</button>
                        <button class="mode-btn active" data-mode="chatta" id="chatta-btn">Chatta</button>
                    </div>
                </div>
                <div class="chat-header-right">
                    <div class="history-container" id="history-container">
                        <button class="chat-header-btn" id="history-btn" title="Visa chatthistorik">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </button>
                        <div class="history-panel" id="history-panel">
                            <div class="history-panel-header">
                                <div class="history-panel-header-left">
                                    <button class="history-close-btn" id="history-close-btn" title="Stäng historik">
                                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                    <h4>Konversationer</h4>
                                </div>
                                <button class="history-clear-all-btn" id="history-clear-all-btn">Rensa alla</button>
                            </div>
                            <div class="history-list" id="history-list">
                                <div class="history-empty">Ingen historik ännu</div>
                            </div>
                        </div>
                    </div>
                    <button class="chat-header-btn" id="clear-chat-btn" title="Starta en ny konversation">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                    <div class="profile-menu-container" id="profile-menu-container">
                        <div class="user-avatar" id="user-avatar" title="Visa profilalternativ">?</div>
                        <div class="profile-dropdown" id="profile-dropdown">
                            <div class="profile-dropdown-info">
                                <div class="token-balance" id="token-balance" title="Ditt tokensaldo">
                                    <span class="token-count" id="token-count">---</span>
                                    <span class="token-label">tokens</span>
                                </div>
                            </div>
                            <a href="#" class="profile-dropdown-item" id="account-settings-btn">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                Kontoinställningar
                            </a>
                            <div class="profile-dropdown-divider"></div>
                            <div class="profile-dropdown-item logout" id="logout-btn">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                </svg>
                                Logga ut
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="chat-empty"></div>
            </div>
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <div class="attached-images" id="attached-images"></div>
                    <textarea class="chat-input" id="chat-input" placeholder="Skriv ditt meddelande..."
                        rows="1"></textarea>
                </div>
                <div class="chat-actions">
                    <button class="upload-btn" id="upload-btn" title="Ladda upp fil">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                    </button>
                    <button class="mic-btn" id="mic-btn" title="Röstinmatning (Groq Whisper)">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 10v2a7 7 0 01-14 0v-2" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19v4" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 23h8" />
                        </svg>
                    </button>
                    <input type="file" id="file-input" accept="image/*,.pdf,.txt,.md,.js,.ts,.py,.json,.html,.css"
                        multiple style="display: none;">
                    <button class="snip-btn" id="snip-btn" title="Fånga skärmregion (Klipp)">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </button>
                    <button class="chat-send-btn" id="chat-send-btn">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                        Skicka
                    </button>
                </div>
            </div>
        </section>

        <!-- Image Preview Modal -->
        <div class="image-modal" id="image-modal">
            <button class="close-btn" id="modal-close-btn">×</button>
            <img id="modal-image" src="" alt="Preview">
        </div>

    </main>

    <script src="renderer.js"></script>
</body>

</html>
