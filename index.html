<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyt - Kontrollpanel</title>
    <link rel="stylesheet" href="theme.css">
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        /* ═══════════════════════════════════════════════════════════════════════════
         * DASHBOARD LAYOUT - HELPER POPUP STYLE
         * ═══════════════════════════════════════════════════════════════════════════ */

        html,
        body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════════════════════════════════
         * CUSTOM TITLE BAR (Frameless Window)
         * ═══════════════════════════════════════════════════════════════════════════ */

        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 38px;
            padding: 0 var(--spacing-md) 0 var(--spacing-lg);
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-subtle);
            -webkit-app-region: drag;
            /* Makes the title bar draggable */
            flex-shrink: 0;
            user-select: none;
        }

        .title-bar-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .title-bar-logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: var(--font-size-md);
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
        }

        .title-bar-logo .logo-icon {
            width: 20px;
            height: 20px;
            background: var(--gradient-ai);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title-bar-logo .logo-icon svg {
            width: 12px;
            height: 12px;
            color: white;
        }

        .title-bar-hint {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
        }

        .title-bar-controls {
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-app-region: no-drag;
            /* Buttons should not be draggable */
        }

        .title-bar-btn {
            width: 32px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .title-bar-btn:hover {
            background: var(--surface-secondary);
            color: var(--text-primary);
        }

        .title-bar-btn.pin-btn.active {
            color: var(--color-accent-cta);
            background: rgba(var(--color-accent-cta-rgb), 0.2);
            box-shadow: 0 0 8px rgba(var(--color-accent-cta-rgb), 0.3);
        }

        .title-bar-btn.close-btn:hover {
            background: rgba(var(--color-error-rgb), 0.8);
            color: white;
        }

        .title-bar-btn svg {
            width: 14px;
            height: 14px;
        }

        /* User Avatar - Compact */
        .user-avatar {
            width: 24px;
            height: 24px;
            background: var(--gradient-primary);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
            font-size: var(--font-size-xs);
            cursor: default;
        }

        .logout-btn {
            width: 26px;
            height: 26px;
            padding: 0;
            background: rgba(var(--color-error-rgb), 0.15);
            border: 1px solid rgba(var(--color-error-rgb), 0.3);
            border-radius: var(--radius-md);
            color: var(--color-accent-alert-light);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition-slow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-btn:hover {
            background: rgba(var(--color-error-rgb), 0.25);
            border-color: rgba(var(--color-error-rgb), 0.5);
        }

        /* Token Balance Display - Compact */
        .token-balance {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-xs) var(--spacing-sm);
            background: rgba(var(--color-secondary-rgb), 0.15);
            border: 1px solid rgba(var(--color-secondary-rgb), 0.3);
            border-radius: var(--radius-sm);
            cursor: default;
        }

        .token-icon {
            font-size: 0.7rem;
        }

        .token-count {
            font-size: 0.7rem;
            font-weight: var(--font-weight-semibold);
            color: var(--color-secondary);
        }

        .token-balance.low {
            background: rgba(var(--color-error-rgb), 0.15);
            border-color: rgba(var(--color-error-rgb), 0.3);
        }

        .token-balance.low .token-count {
            color: var(--color-accent-alert-light);
        }

        .token-balance.updating {
            opacity: 0.7;
        }

        /* Main Content - Full Width Chat */
        .main-content {
            padding: 0;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Loading State */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-default);
            border-radius: var(--radius-full);
            border-top-color: var(--color-primary);
            animation: spin 0.8s linear infinite;
            margin-right: var(--spacing-md);
            vertical-align: middle;
        }

        /* Loading overlay for initial load */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: var(--z-modal);
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loading-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-subtle);
            border-radius: var(--radius-full);
            border-top-color: var(--color-primary-light);
            animation: spin 1s linear infinite;
            margin-bottom: var(--spacing-xl);
        }

        .loading-overlay p {
            color: var(--text-secondary);
        }

        /* ═══════════════════════════════════════════════════════════════════════════
         * CHAT SECTION - Compact Helper Style
         * ═══════════════════════════════════════════════════════════════════════════ */

        .chat-section {
            background: var(--bg-night-sky);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            min-height: 0;
            position: relative;
        }

        .chat-background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 0;
            opacity: 0.7;
            width: 100%;
            text-align: center;
        }

        .chat-background .bg-logo {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
            filter: brightness(0.8);
        }



        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-lg) var(--spacing-lg) 4px var(--spacing-lg);
            flex-shrink: 0;
            gap: var(--spacing-md);
            position: relative;
            z-index: 1;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            flex: 1;
            min-width: 0;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md) var(--spacing-lg);
            background: transparent;
            border-radius: 0;
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            min-height: 0;
            border: none;
            position: relative;
            z-index: 1;
        }

        .chat-message {
            display: flex;
            gap: var(--spacing-md);
            max-width: 95%;
        }

        .chat-message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chat-message.assistant {
            align-self: flex-start;
        }

        .message-avatar {
            width: 26px;
            height: 26px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-semibold);
            flex-shrink: 0;
        }

        .chat-message.user .message-avatar {
            background: var(--gradient-user);
            color: var(--text-primary);
        }

        .chat-message.assistant .message-avatar {
            background: var(--gradient-ai);
            color: white;
        }

        .message-content {
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-2xl);
            line-height: var(--line-height-normal);
            font-size: var(--font-size-base);
        }

        .chat-message.user .message-content {
            background: var(--gradient-user);
            color: var(--text-primary);
            border-bottom-right-radius: var(--radius-sm);
        }

        .chat-message.assistant .message-content {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-bottom-left-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            overflow-x: auto;
            margin: var(--spacing-md) 0;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .message-content code {
            font-family: var(--font-mono);
            background: rgba(0, 0, 0, 0.2);
            padding: 2px var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: 0.85em;
        }

        /* ═══════════════════════════════════════════════════════════════════════════
         * MATH RENDERING (KaTeX)
         * ═══════════════════════════════════════════════════════════════════════════ */

        .math-block {
            margin: var(--spacing-lg) 0;
            padding: var(--spacing-md) var(--spacing-lg);
            background: rgba(0, 0, 0, 0.15);
            border-radius: var(--radius-md);
            overflow-x: auto;
            text-align: center;
        }

        .math-block .katex {
            font-size: 1.1em;
        }

        .math-inline {
            display: inline;
        }

        .math-inline .katex {
            font-size: 1em;
        }

        .math-fallback {
            font-family: var(--font-mono);
            background: rgba(0, 0, 0, 0.2);
            padding: 2px var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: 0.9em;
            color: var(--color-secondary);
        }

        /* KaTeX color overrides for dark theme */
        .katex {
            color: var(--text-primary);
        }

        /* ═══════════════════════════════════════════════════════════════════════════
         * TOOL EXECUTION STYLES
         * ═══════════════════════════════════════════════════════════════════════════ */

        .chat-message.tool-execution .message-avatar {
            background: var(--gradient-cta);
            color: var(--text-on-accent);
            font-size: 14px;
        }

        .tool-running,
        .tool-completed {
            border-left: 3px solid var(--color-accent-cta);
            padding-left: var(--spacing-lg) !important;
        }

        .tool-success {
            border-left-color: var(--color-success) !important;
        }

        .tool-error {
            border-left-color: var(--color-error) !important;
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--spacing-md);
            font-size: var(--font-size-md);
        }

        .tool-icon {
            font-size: 1rem;
        }

        .tool-command {
            background: rgba(0, 0, 0, 0.4) !important;
            padding: 10px 14px !important;
            border-radius: var(--radius-md);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--color-accent-cta);
            margin: var(--spacing-md) 0 !important;
            overflow-x: auto;
        }

        .tool-command code {
            background: none !important;
            padding: 0 !important;
            color: inherit;
        }

        .tool-output {
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 2px;
            max-height: 300px;
            overflow: auto;
        }

        .tool-output pre {
            margin: 0 !important;
            padding: 10px !important;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .tool-output code {
            background: none !important;
            padding: 0 !important;
            color: var(--text-secondary);
        }

        .chat-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }

        .chat-empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: var(--spacing-xl);
            opacity: 0.5;
        }

        /* ═══════════════════════════════════════════════════════════════════════════
         * CHAT INPUT - Compact
         * ═══════════════════════════════════════════════════════════════════════════ */

        .chat-input-container {
            display: flex;
            gap: var(--spacing-md);
            flex-shrink: 0;
            align-items: flex-end;
            padding: var(--spacing-lg);
            position: relative;
            z-index: 1;
        }

        .chat-input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .attached-images {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .attached-image {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 2px solid rgba(var(--color-info-rgb), 0.5);
        }

        .attached-image img {
            height: 60px;
            max-width: 120px;
            object-fit: cover;
            display: block;
        }

        .attached-image .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            background: rgba(var(--color-error-rgb), 0.9);
            border: none;
            border-radius: var(--radius-full);
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .attached-image .remove-btn:hover {
            background: var(--color-error);
        }

        .chat-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-night-sky);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            color: var(--text-primary);
            font-size: var(--font-size-sm);
            outline: none;
            transition: all var(--transition-slow);
            resize: none;
            font-family: var(--font-family);
            min-height: 40px;
            max-height: 100px;
        }

        .chat-input:focus {
            border-color: var(--color-accent-cta);
            background: var(--bg-primary);
            box-shadow: 0 0 0 2px rgba(var(--color-accent-cta-rgb), 0.15);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-actions {
            display: flex;
            gap: var(--spacing-md);
        }

        .snip-btn {
            padding: 10px;
            background: rgba(var(--color-accent-alert-rgb), 0.15);
            border: 1px solid rgba(var(--color-accent-alert-rgb), 0.3);
            border-radius: var(--radius-xl);
            color: var(--color-accent-alert-light);
            cursor: pointer;
            transition: all var(--transition-slow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .snip-btn:hover {
            background: rgba(var(--color-accent-alert-rgb), 0.25);
            border-color: rgba(var(--color-accent-alert-rgb), 0.5);
            color: var(--color-accent-alert-light);
            box-shadow: 0 0 12px rgba(var(--color-accent-alert-rgb), 0.3);
        }

        .snip-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .snip-btn svg {
            width: 18px;
            height: 18px;
        }

        /* File Upload Button */
        .upload-btn {
            padding: 10px;
            background: rgba(var(--color-info-rgb), 0.15);
            border: 1px solid rgba(var(--color-info-rgb), 0.3);
            border-radius: var(--radius-xl);
            color: var(--color-info);
            cursor: pointer;
            transition: all var(--transition-slow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-btn:hover {
            background: rgba(var(--color-info-rgb), 0.25);
            border-color: rgba(var(--color-info-rgb), 0.5);
            box-shadow: 0 0 12px rgba(var(--color-info-rgb), 0.3);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upload-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Drag and Drop Overlay */
        .drop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(var(--color-info-rgb), 0.15);
            border: 3px dashed var(--color-info);
            border-radius: var(--radius-xl);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .drop-overlay.active {
            display: flex;
        }

        .drop-overlay-content {
            text-align: center;
            color: var(--color-info);
        }

        .drop-overlay-content svg {
            width: 48px;
            height: 48px;
            margin-bottom: var(--spacing-md);
            opacity: 0.8;
        }

        .drop-overlay-content p {
            font-size: var(--font-size-md);
            font-weight: var(--font-weight-semibold);
        }

        /* Chat section needs position relative for overlay */
        .chat-section {
            position: relative;
        }

        .chat-send-btn {
            padding: 10px 16px;
            background: var(--gradient-cta);
            border: none;
            border-radius: var(--radius-xl);
            color: var(--text-on-accent);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: all var(--transition-slow);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .chat-send-btn:hover {
            box-shadow: var(--shadow-cta);
        }

        .chat-send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chat-send-btn svg {
            width: 16px;
            height: 16px;
        }

        /* ═══════════════════════════════════════════════════════════════════════════
         * MESSAGE IMAGES
         * ═══════════════════════════════════════════════════════════════════════════ */

        .message-images {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .message-images img {
            max-width: 300px;
            max-height: 200px;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: transform var(--transition-base);
        }

        .message-images img:hover {
            transform: scale(1.02);
        }

        /* Image preview modal */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: var(--z-tooltip);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .image-modal.show {
            display: flex;
        }

        .image-modal img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            border-radius: var(--radius-lg);
        }

        .image-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: var(--surface-secondary);
            border: none;
            border-radius: var(--radius-full);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-modal .close-btn:hover {
            background: var(--surface-elevated);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-lg) var(--spacing-xl);
            background: var(--bg-tertiary);
            border-radius: var(--radius-3xl);
            border-bottom-left-radius: var(--radius-sm);
            width: fit-content;
            border: 1px solid var(--border-subtle);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--color-secondary);
            border-radius: var(--radius-full);
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .clear-chat-btn {
            padding: var(--spacing-xs) var(--spacing-sm);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: var(--font-size-xs);
            cursor: pointer;
            transition: all var(--transition-slow);
        }

        .clear-chat-btn:hover {
            background: rgba(var(--color-secondary-rgb), 0.2);
            border-color: rgba(var(--color-secondary-rgb), 0.4);
            color: var(--color-secondary);
        }

        /* ═══════════════════════════════════════════════════════════════════════════
         * SYSTEM PROMPT SECTION - Compact
         * ═══════════════════════════════════════════════════════════════════════════ */

        .system-prompt-section {
            background: var(--surface-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-md);
            overflow: hidden;
            flex-shrink: 0;
        }

        .system-prompt-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-sm) var(--spacing-lg);
            cursor: pointer;
            transition: background var(--transition-base);
        }

        .system-prompt-header:hover {
            background: var(--surface-secondary);
        }

        .system-prompt-header h3 {
            font-size: 0.75rem;
            font-weight: var(--font-weight-medium);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .system-prompt-header h3 svg {
            width: 14px;
            height: 14px;
            opacity: 0.6;
        }

        .system-prompt-toggle {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .system-prompt-toggle svg {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            transition: transform var(--transition-slow);
        }

        .system-prompt-section.expanded .system-prompt-toggle svg {
            transform: rotate(180deg);
        }

        .refresh-sysinfo-btn {
            padding: var(--spacing-xs) var(--spacing-md);
            background: rgba(var(--color-info-rgb), 0.15);
            border: 1px solid rgba(var(--color-info-rgb), 0.3);
            border-radius: var(--radius-md);
            color: var(--color-info);
            font-size: var(--font-size-xs);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .refresh-sysinfo-btn:hover {
            background: rgba(var(--color-info-rgb), 0.25);
        }

        .system-prompt-content {
            display: none;
            padding: 0 var(--spacing-xl) var(--spacing-xl) var(--spacing-xl);
            max-height: 300px;
            overflow-y: auto;
        }

        .system-prompt-section.expanded .system-prompt-content {
            display: block;
        }

        .prompt-textarea {
            width: 100%;
            min-height: 120px;
            padding: var(--spacing-lg);
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            line-height: var(--line-height-normal);
            resize: vertical;
            outline: none;
            transition: border-color var(--transition-base);
        }

        .prompt-textarea:focus {
            border-color: var(--color-primary-light);
        }

        .prompt-textarea::placeholder {
            color: var(--text-muted);
        }

        .prompt-label {
            display: block;
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
            font-weight: var(--font-weight-medium);
        }

        .prompt-group {
            margin-bottom: var(--spacing-lg);
        }

        .prompt-group:last-child {
            margin-bottom: 0;
        }

        .system-info-display {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-secondary);
            max-height: 200px;
            overflow-y: auto;
            line-height: var(--line-height-normal);
        }

        .system-info-display .info-row {
            display: flex;
            margin-bottom: var(--spacing-xs);
        }

        .system-info-display .info-label {
            color: var(--color-primary-light);
            min-width: 85px;
            flex-shrink: 0;
        }

        .system-info-display .info-value {
            color: var(--text-secondary);
        }

        .prompt-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .prompt-btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .prompt-btn.save {
            background: rgba(var(--color-success-rgb), 0.15);
            border: 1px solid rgba(var(--color-success-rgb), 0.3);
            color: var(--color-success);
        }

        .prompt-btn.save:hover {
            background: rgba(var(--color-success-rgb), 0.25);
        }

        .prompt-btn.reset {
            background: var(--surface-primary);
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
        }

        .prompt-btn.reset:hover {
            background: var(--surface-secondary);
        }

        .prompt-saved-indicator {
            font-size: var(--font-size-sm);
            color: var(--color-success);
            margin-left: auto;
            opacity: 0;
            transition: opacity var(--transition-slow);
        }

        .prompt-saved-indicator.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <!-- Custom Title Bar (Frameless Window) -->
    <div class="title-bar">
        <div class="title-bar-left">
            <div class="title-bar-logo">
                <img src="assets/logo.svg" alt="Flyt Logo" style="width: 20px; height: 20px; margin-right: 8px;">
                Flyt
            </div>
            <span class="title-bar-hint">Ctrl+Shift+C</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-bar-btn pin-btn" id="pin-btn" title="Fäst överst">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                </svg>
            </button>
            <button class="title-bar-btn minimize-btn" id="minimize-btn" title="Minimera till aktivitetsfältet">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
                </svg>
            </button>
            <button class="title-bar-btn close-btn" id="close-btn" title="Stäng (finns kvar i aktivitetsfältet)">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Laddar din kontrollpanel...</p>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- AI Chat Section -->
        <section class="chat-section">
            <div class="chat-background">
                <img src="assets/logo.svg" class="bg-logo" alt="">
            </div>
            <!-- Drop Overlay for Drag and Drop -->
            <div class="drop-overlay" id="drop-overlay">
                <div class="drop-overlay-content">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p>Släpp filer här för att bifoga</p>
                </div>
            </div>
            <div class="chat-header">
                <div class="chat-header-left">
                    <div class="token-balance" id="token-balance" title="Ditt tokensaldo">
                        <span class="token-icon">🪙</span>
                        <span class="token-count" id="token-count">---</span>
                    </div>
                </div>
                <div class="chat-header-right">
                    <div class="user-avatar" id="user-avatar" title="Laddar...">?</div>
                    <button class="clear-chat-btn" id="clear-chat-btn">Rensa</button>
                    <button class="logout-btn" id="logout-btn">↪</button>
                </div>
            </div>
            <!-- Hidden email for JS reference -->
            <span id="user-email" style="display: none;">Laddar...</span>

            <div class="chat-messages" id="chat-messages">
                <div class="chat-empty"></div>
            </div>
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <div class="attached-images" id="attached-images"></div>
                    <textarea class="chat-input" id="chat-input" placeholder="Skriv ditt meddelande..."
                        rows="1"></textarea>
                </div>
                <div class="chat-actions">
                    <button class="upload-btn" id="upload-btn" title="Ladda upp fil">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                    </button>
                    <input type="file" id="file-input" accept="image/*,.pdf,.txt,.md,.js,.ts,.py,.json,.html,.css"
                        multiple style="display: none;">
                    <button class="snip-btn" id="snip-btn" title="Fånga skärmregion (Klipp)">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </button>
                    <button class="chat-send-btn" id="chat-send-btn">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                        Skicka
                    </button>
                </div>
            </div>
        </section>

        <!-- Image Preview Modal -->
        <div class="image-modal" id="image-modal">
            <button class="close-btn" id="modal-close-btn">×</button>
            <img id="modal-image" src="" alt="Preview">
        </div>

    </main>

    <script src="renderer.js"></script>
</body>

</html>
